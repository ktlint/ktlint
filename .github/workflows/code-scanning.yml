# Code scanning with CodeQL
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '41 8 * * 3'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: kotlin
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: matrix.language == 'kotlin'
        name: Setup Gradle build
        uses: ./.github/actions/setup-gradle-build

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        id: codeql-init
        # Allow failure for Kotlin: CodeQL may not yet support the current Kotlin compiler version.
        continue-on-error: ${{ matrix.language == 'kotlin' }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
      - if: matrix.language == 'kotlin'
        name: Build with release Kotlin version
        id: kotlin-build
        continue-on-error: true
        shell: bash
        run: ./gradlew build -x test --no-build-cache

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        # Allow failure for Kotlin: CodeQL may not yet support the current Kotlin compiler version.
        continue-on-error: ${{ matrix.language == 'kotlin' }}
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

      - if: matrix.language == 'kotlin'
        name: Build with release Kotlin version
        id: report-codeql-init-outcome
        continue-on-error: true
        shell: bash
        run: echo ${{steps.codeql-init.outcome}}

      - if: matrix.language == 'kotlin'
        name: Build with release Kotlin version
        id: report-codeql-analyze-outcome
        continue-on-error: true
        shell: bash
        run: echo ${{steps.codeql-analyze.outcome}}

      - if: matrix.language == 'kotlin' && (steps.codeql-init.outcome == 'failure' || steps.codeql-analyze.outcome == 'failure')
        name: Check whether CodeQL failure is due to unsupported Kotlin version
        shell: bash
        run: |
          # CodeQL logs a message like:
          #   "Kotlin version 2.5.0-RC is too recent. CodeQL currently supports versions below 2.4.30"
          #   "The Kotlin version installed (`2.5.0-RC`) is too recent for this version of CodeQL. Install a version lower than 2.4.30."
          # when the Kotlin version is not yet supported. Treat this as a warning, not a failure.
          if grep -r "is too recent" "$RUNNER_TEMP" 2>/dev/null | grep -q "Install a version lower than"; then
            msg=$(grep -r "is too recent" "$RUNNER_TEMP" 2>/dev/null | grep "Install a version lower than" | head -1 | sed 's/.*\(Kotlin version.*\)/\1/')
            echo "::warning::CodeQL Kotlin analysis skipped: ${msg}. Upgrade github/codeql-action once support is available."
          else
            echo "CodeQL analysis for Kotlin failed for an unexpected reason. Failing the job."
            exit 1
          fi

      - if: matrix.language == 'kotlin'
        name: Check whether CodeQL failure is due to unsupported Kotlin version 2
        shell: bash
        run: |
          # CodeQL logs a message like:
          #   "Kotlin version 2.5.0-RC is too recent. CodeQL currently supports versions below 2.4.30"
          #   "The Kotlin version installed (`2.5.0-RC`) is too recent for this version of CodeQL. Install a version lower than 2.4.30."
          # when the Kotlin version is not yet supported. Treat this as a warning, not a failure.
          if grep -r "is too recent" "$RUNNER_TEMP" 2>/dev/null | grep -q "Install a version lower than"; then
            echo "RUNNER_TEMP: $RUNNER_TEMP"
            echo "With text too recent: $(grep -r "is too recent" "$RUNNER_TEMP")"
            echo "With text install version lower than: $(grep -r "is too recent" "$RUNNER_TEMP" 2>/dev/null | grep "Install a version lower than" | head -1)"
            msg=$(grep -r "is too recent" "$RUNNER_TEMP" 2>/dev/null | grep "Install a version lower than" | head -1
            echo "::warning::CodeQL Kotlin analysis skipped: ${msg}. Upgrade github/codeql-action once support is available."
          else
            if ${{ steps.codeql-analyze.outcome }} == 'failure'; then
              echo "CodeQL analysis for Kotlin failed for an unexpected reason. Failing the job."
              exit 1
            else
              echo "Nothing to do"
            fi
          fi

      - if: matrix.language == 'kotlin' && success()
        name: Perform CodeQL Analysis
        id: codeql-analyze-2
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
