# Code scanning with CodeQL
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '41 8 * * 3'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: kotlin
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: matrix.language == 'kotlin'
        name: Setup Gradle build
        uses: ./.github/actions/setup-gradle-build

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        id: codeql-init
        # Allow failure for Kotlin when current Kotlin compiler is not yet be supported. So we check for that in the codeql-report step.
        continue-on-error: ${{ matrix.language == 'kotlin' }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
      - if: matrix.language == 'kotlin'
        name: Build with release Kotlin version
        id: kotlin-build
        continue-on-error: true
        shell: bash
        run: ./gradlew build -x test --no-build-cache

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        # Allow failure for Kotlin when current Kotlin compiler is not yet be supported. So we check for that in the codeql-report step.
        continue-on-error: ${{ matrix.language == 'kotlin' }}
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
          # Set output directory so that we can pick up the sarif file from the java/kotlin analysis in the last step
          output: ${{ runner.temp }}/codeql-sarif

      - if: matrix.language == 'kotlin'
        id: codeql-report
        name: Check whether CodeQL failure is due to unsupported Kotlin version
        shell: bash
        env:
          SARIF_FILE: ${{ runner.temp }}/codeql-sarif/java.sarif
        run: |
          if [ ! -f $SARIF_FILE ]; then
            echo "::warning::Cannot find file "$SARIF_FILE" which contains the result of the Java/Kotlin CodeQL analysis".
            exit 1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::jq command not available"
            exit 2
          fi
          # Check if a notification is found which may not be ignored. Notifications regarding the kotlin version being too new should be
          # ignored to prevent that this job fails. Kotlin updates in CodeQL tend too lag behind with updates in Ktlint.
          NOTIFICATIONS_WHICH_MAY_NOT_BE_IGNORED="$(
            jq '
              [
                .runs[].invocations[].toolExecutionNotifications[] |
                select(.descriptor.id != "java/extractor-agent/kotlin-version-too-new") |
                select(.level == "error") |
                select((.message.text // "" | length > 0) or (.message.markdown // "" | length > 0))
              ]
              ' $SARIF_FILE
          )"
          if [ "$NOTIFICATIONS_WHICH_MAY_NOT_BE_IGNORED" != "[]" ]; then
            echo "Found CodeQL notifications which may not be ignored."
            echo "$NOTIFICATIONS_WHICH_MAY_NOT_BE_IGNORED"
            exit 3
          fi
          # Check if a notification is found related to the Kotlin version being too new. If multiple are found than pick the most recent
          # message.
          MESSAGE_KOTLIN_VERSION_TOO_NEW="$(
            jq '
              [
                .runs[].invocations[].toolExecutionNotifications[] |
                select(.descriptor.id == "java/extractor-agent/kotlin-version-too-new")
              ] |
              sort_by(.timeUtc) |
              last |
              .message.text
              ' $SARIF_FILE
          )"
          if [ $MESSAGE_KOTLIN_VERSION_TOO_NEW != "null" ]; then
            # If only notifications are found related to Kotlin version being to new, then do not fail the CodeQL job.
            echo "::warning::$MESSAGE_KOTLIN_VERSION_TOO_NEW"
          else
            echo "No CodeQL notification found that should fail the job"
          fi
