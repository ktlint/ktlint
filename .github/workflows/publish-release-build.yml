name: Publish release build
permissions:
  contents: write

on:
  push:
    tags:
      - '*.*.*'

jobs:
  # Ktlint now requires the Kotlin Analysis API which is only exposed as from Kotlin 2.5.0. So we need to skip build with non-dev version
  # of kotlin temporarily. Remove this step when Kotlin "2.5.0" is officially released.
  check-kotlin-version:
    runs-on: ubuntu-latest
    outputs:
      kotlin-is-rc: ${{ steps.check.outputs.kotlin-is-rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 'master'
      - id: check
        run: |
          version=$(grep '^kotlin = ' gradle/libs.versions.toml | sed 's/kotlin = "\(.*\)"/\1/')
          if [[ "$version" == 2.5.0-RC* ]]; then
            echo "kotlin-is-rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "kotlin-is-rc=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  prepare:
    needs: check-kotlin-version
    runs-on: ubuntu-latest
    if: github.repository == 'ktlint/ktlint'
    env:
      # Ktlint now requires the Kotlin Analysis API which is only exposed as from Kotlin 2.5.0. So we need to skip build with non-dev
      # version of kotlin temporarily. Remove this flag (and needs above) when Kotlin "2.5.0" is officially released.
      KOTLIN_DEV_FLAG: ${{ needs.check-kotlin-version.outputs.kotlin-is-rc == 'true' && '-PkotlinDev' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 'master'

      - uses: ./.github/actions/setup-gradle-build

      - name: Validate changelog.md
        id: validate_changelog
        if: ${{ success() }}
        run: |
          FIRST_HEADING2=$(grep "^## " CHANGELOG.md | head -n 1)
          echo "First heading2 found: $FIRST_HEADING2"
          # Allow version numbers like "2.0.0" and "2.0.0-ALPHA-1"
          if [[ ! "$FIRST_HEADING2" =~ ^##[[:space:]]\[[0-9]+\.[0-9]+\.[0-9]+((-[A-Z0-9]+)*)?\][[:space:]]-[[:space:]][0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "First heading at level 2 should match '## [X.Y.Z] - [YYYY-MM-DD]' for release or '## [X.Y.Z-A] - [YYYY-MM-DD]' for a pre-release"
            exit 1
          fi

      - name: Build executable
        run: ./gradlew $KOTLIN_DEV_FLAG clean build ktlintCliFiles

  build-native-image:
    name: "Build GraalVM native-image (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    needs: prepare
    if: github.repository == 'ktlint/ktlint'
    strategy:
      matrix:
        # ubuntu-22.04 is pinned (not ubuntu-latest) so the native binary links against an older glibc
        # (2.35), keeping it compatible with RHEL 8, CentOS 7, Debian 11, etc. See
        # https://github.com/google/google-java-format/issues/1072. Bump when either (a) GitHub deprecates
        # the ubuntu-22.04 runner, or (b) a real user need requires a newer glibc feature.
        os: [ubuntu-22.04, macos-latest, windows-latest]
        include:
          - os: ubuntu-22.04
            output-name: ktlint_linux-x86-64
            upload-artifact-path: ktlint_linux-x86-64
          - os: macos-latest
            output-name: ktlint_darwin-arm64
            upload-artifact-path: ktlint_darwin-arm64
          - os: windows-latest
            output-name: ktlint_windows-x86-64
            upload-artifact-path: ktlint_windows-x86-64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 'master'

#      - name: Get version
#        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
#        shell: bash

      - name: Build the native image
        uses: ./.github/actions/build-native-image
        with:
          output-name: ${{ matrix.output-name }}

      - name: Upload native image
        id: upload-native-image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output-name }}
          path: ${{ matrix.upload-artifact-path }}
          archive: false
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, build-native-image, check-kotlin-version]
    if: github.repository == 'ktlint/ktlint'
    env:
      # Ktlint now requires the Kotlin Analysis API which is only exposed as from Kotlin 2.5.0. So we need to skip build with non-dev
      # version of kotlin temporarily. Remove this flag (and needs above) when Kotlin "2.5.0" is officially released.
      KOTLIN_DEV_FLAG: ${{ needs.check-kotlin-version.outputs.kotlin-is-rc == 'true' && '-PkotlinDev' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 'master'

      - uses: ./.github/actions/setup-gradle-build

      - name: Publish to Maven
        run: ./gradlew $KOTLIN_DEV_FLAG ktlintCliFiles publishMavenPublicationToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME_KTLINT_2 }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_TOKEN_KTLINT_2 }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY_KTLINT_2 }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEYID_KTLINT_2 }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD_KTLINT_2 }}

      - name: List Ktlint CLI build artifacts
        run: ls -R -alsh ktlint-cli/build/run
        shell: bash

      - name: Get version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
        shell: bash

      - name: Create zip for dependency manager(s)
        if: ${{ success() }}
        run: |
          cd ktlint-cli/build/run
          mkdir -p ktlint-${{ env.version }}/bin
          cp ktlint ktlint-${{ env.version }}/bin
          zip -rm ktlint-${{ env.version }}.zip ktlint-${{ env.version }}

      - name: Download native image artifacts
        uses: actions/download-artifact@v8
        with:
          path: ktlint-cli/build/native-images
          merge-multiple: true

      - name: List downloaded native images
        run: ls -R ktlint-cli/build/native-images
        shell: bash

      - name: Extract release notes
        id: release_notes
        if: ${{ success() }}
        uses: ffurrer2/extract-release-notes@v3

      - name: Create GitHub (draft) release
        id: github_draft_release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v3
        with:
          # Create a draft release is required in case of a prerelease. By default, a prerelease is published which results in failure when
          # uploading the artifacts
          draft: true
          prerelease: ${{ contains(env.version,'-') }}
          body: ${{ steps.release_notes.outputs.release_notes }}
          fail_on_unmatched_files: true
          files: |
            ktlint-cli/build/run/*
            ktlint-cli/build/native-images/ktlint_linux-x86-64
            ktlint-cli/build/native-images/ktlint_darwin-arm64
            ktlint-cli/build/native-images/ktlint_windows-x86-64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bump Homebrew formula only when not a pre-release (e.g. "2.0.0-ALPHA-1")
      - name: Bump Homebrew Formula
        if: ${{ (success() && contains(env.version,'-') == false ) }}
        uses: mislav/bump-homebrew-formula-action@v4.2
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        with:
          formula-name: ktlint
          formula-path: Formula/k/ktlint.rb
          download-url: https://github.com/ktlint/ktlint/releases/download/${{ env.version }}/ktlint-${{ env.version }}.zip

      - name: Update Release documentation
        if: ${{ success() }}
        run: |
          git config user.email "ktlint@github.com"
          git config user.name "Ktlint Release Workflow" |
          ./.announce -y
        env:
          VERSION: ${{ env.version }}

      - name: Publish GitHub release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(env.version,'-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

